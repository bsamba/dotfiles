# Compose file version key removed (deprecated in v2+ CLI)
networks:
  runner-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.29.0.0/16

volumes:
  run001-docker-storage:
  run001-docker-certs:
  run001-buildkit-cache:
  run002-docker-storage:
  run002-docker-certs:
  run002-buildkit-cache:

services:
  runner-001:
    image: ghcr.io/actions/actions-runner:2.335.1
    container_name: runner-001
    hostname: n3o0x65lnxrun001
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"
    command: >-
      /bin/bash -c "cd /home/runner &&
      cp -n /home/runner/config/.runner .runner 2>/dev/null || true &&
      cp -n /home/runner/config/.credentials .credentials 2>/dev/null || true &&
      cp -n /home/runner/config/.credentials_rsaparams .credentials_rsaparams 2>/dev/null || true &&
      if [ -f .runner ]; then
        echo 'Runner already configured, skipping registration';
      else
        ./config.sh --url https://github.com/n3otech --token ${RUNNER_TOKEN_001} --name n3o0x65lnxrun001 --labels self-hosted,linux,x64,runner,dotnet,docker --work _work --unattended --replace --disableupdate &&
      cp -f .runner /home/runner/config/.runner &&
      cp -f .credentials /home/runner/config/.credentials &&
      (cp -f .credentials_rsaparams /home/runner/config/.credentials_rsaparams 2>/dev/null || true);
      fi &&
      exec ./run.sh"
    networks:
      - runner-network
    security_opt:
      - "apparmor=docker-default"
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - AUDIT_WRITE
      - DAC_OVERRIDE
      - SYS_ADMIN
    tmpfs:
      - /run
      - /tmp:exec
    environment:
      RUNNER_NAME: n3o0x65lnxrun001
      RUNNER_LABELS: self-hosted,linux,x64,runner,dotnet,docker
      RUNNER_WORKDIR: /home/runner/_work
      RUNNER_SCOPE: org
      RUNNER_ORG: n3otech
      RUNNER_TOKEN: ${RUNNER_TOKEN_001}
      DOCKER_HOST: tcp://docker-001:2376
      DOCKER_TLS_VERIFY: 1
      DOCKER_CERT_PATH: /certs/client
      ACTIONS_RUNNER_PRINT_LOG_TO_STDOUT: 1
      RUNNER_MANUALLY_TRAP_SIG: 1
    volumes:
      - ./config/run001:/home/runner/config
      - ./work/run001:/home/runner/_work
      - run001-docker-certs:/certs:ro
    depends_on:
      docker-001:
        condition: service_healthy
    mem_limit: 15g
    memswap_limit: 16g
    cpus: 4
    healthcheck:
      test: ["CMD-SHELL", "test -f /home/runner/.runner && awk 'NR>1 && $4==\"01\" {split($2,l,\":\"); split($3,r,\":\"); if (l[2]==\"01BB\" || r[2]==\"01BB\") f=1} END{exit !f}' /proc/net/tcp /proc/net/tcp6 && bash -c 'echo >/dev/tcp/docker-001/2376' 2>/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  docker-001:
    image: docker:27.5.1-dind
    container_name: docker-001
    hostname: docker-001
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"
    networks:
      - runner-network
    runtime: runc
    privileged: true
    security_opt:
      # CRITICAL: apparmor=unconfined required for privileged DinD.
      # docker-default re-enables AppArmor even in privileged mode and blocks
      # "mount -t tmpfs none /tmp" in dockerd-entrypoint.sh => crash loop.
      - "apparmor=unconfined"
      - "seccomp=unconfined"
    cap_drop:
      - ALL
    cap_add:
      - NET_RAW
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_CHROOT
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    environment:
      DOCKER_TLS_CERTDIR: /certs
      DOCKER_TLS_VERIFY: 1
      BUILDKIT_INLINE_CACHE: 1
      DOCKER_DAEMON_ARGS: --userland-proxy=false --icc=false --dns 8.8.8.8 --dns 1.1.1.1
    volumes:
      - run001-docker-storage:/var/lib/docker
      - run001-docker-certs:/certs
      - run001-buildkit-cache:/var/lib/buildkit
    mem_limit: 13g
    memswap_limit: 14g
    cpus: 3
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 2376 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

